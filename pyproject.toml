[tool.poetry]
name = "honeyshare"
version = "1.6.0"
description = "Python API client for HoneyShare.live"
license = "MIT"
readme = "README.md"
authors = ["Pedro Melgueira <pedro@honeyshare.live>"]

packages = [
    { include = "honeyshare" },
]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
